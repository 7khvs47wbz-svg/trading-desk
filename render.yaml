# Render Blueprint: New > Blueprint > pick this repo.
# DATABASE_URL: the app's Postgres. It's entered in the dashboard (a free Neon database, which
# doesn't expire). OLD_DATABASE_URL points at the earlier Render Postgres; on startup the app
# copies its rows into DATABASE_URL once, if the new database is still empty (db.migrate_from).
services:
  - type: web
    name: trading-desk-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # one worker keeps the shared price cache and locks in one process; threads serve users in parallel
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 300 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OLD_DATABASE_URL
        fromDatabase:
          name: trading-desk-db
          property: connectionString

databases:
  - name: trading-desk-db
    plan: free
    databaseName: trading_desk
    user: trading_desk
