# Pings the app every 10 minutes so Render's free instance never falls asleep
# (no 50-second wait for visitors). One always-on free service fits in Render's monthly free hours.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 20 https://trading-desk-app-lore.onrender.com/healthz
